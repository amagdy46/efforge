name: Bug report
description: efforge, or a project it generated, does something wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The details below let us run what you ran. Remove secrets and private paths from anything you paste.
  - type: input
    id: version
    attributes:
      label: efforge version
      description: "`npx create-efforge --version`, or `efforgeVersion` in the project's `efforge.jsonc`."
      placeholder: "0.3.0"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The exact command you ran, with every flag.
      render: sh
      placeholder: npm create efforge my-app -- --yes --database=d1 --orm=effect-sql
    validations:
      required: true
  - type: textarea
    id: stack
    attributes:
      label: Stack
      description: The `stack` object from the project's `efforge.jsonc`. Leave empty if no project was created.
      render: jsonc
  - type: input
    id: node
    attributes:
      label: Node version
      description: "`node --version`"
      placeholder: v24.11.0
    validations:
      required: true
  - type: input
    id: pnpm
    attributes:
      label: pnpm version
      description: "`pnpm --version`"
      placeholder: 12.21.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15, Ubuntu 24.04, Windows 11
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Everything the command printed, including the error. Add `--log-level debug` for more detail.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What should have happened instead.
    validations:
      required: true
