name: Release
# Push a tag `vX.Y.Z` matching package.json to publish create-efforge to npm and create the GitHub
# release from that version's CHANGELOG section. npm authenticates this workflow through trusted
# publishing (OIDC): no token is stored, and provenance is attached automatically.
on:
  push:
    tags: ["v*"]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # the GitHub release
  id-token: write # npm trusted publishing

env:
  CI: "1"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format --check
      - run: pnpm test
      # Pack once. The smoke test and npm publish use this same file, so the bytes that passed
      # are the bytes that ship. Publishing a tarball skips lifecycle scripts; dist/ is built here.
      - name: Build and pack
        id: pack
        run: |
          pnpm build
          mkdir -p "$RUNNER_TEMP/pack"
          pnpm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/pack"
          echo "tarball=$(ls "$RUNNER_TEMP"/pack/*.tgz)" >> "$GITHUB_OUTPUT"
      # the tarball must install with npm alone, with no lockfile, create, build and add (docs/decisions/0004)
      - name: Smoke-test the tarball
        env:
          # so create's initial commit and add's clean-tree check behave as on a user's machine
          GIT_AUTHOR_NAME: efforge-ci
          GIT_AUTHOR_EMAIL: efforge-ci@users.noreply.github.com
          GIT_COMMITTER_NAME: efforge-ci
          GIT_COMMITTER_EMAIL: efforge-ci@users.noreply.github.com
        run: pnpm smoke:pack --tarball "${{ steps.pack.outputs.tarball }}" --dir "$RUNNER_TEMP"
      # trusted publishing needs npm 11.5.1+
      - run: npm install -g npm@latest
      # trusted publishing and provenance work the same for a tarball as for a directory
      - run: npm publish "${{ steps.pack.outputs.tarball }}" --access public
      - name: GitHub release from the CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## " v "( |$)" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          printf '\n```sh\nnpm create efforge@%s my-app\n```\n' "$version" >> notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
