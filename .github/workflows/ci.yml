name: CI
on:
  pull_request:
  push:
    branches: [main]
  # Daily, so a dependency release that breaks new projects shows up within a day even when
  # nothing here changed. Generated projects install without a lockfile, so they resolve
  # against today's npm.
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

concurrency:
  # the event is part of the key, so a scheduled run and a push to main don't cancel each other
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "1"

jobs:
  unit:
    name: unit (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # scheduled and manual runs fetch every package fresh: a cached store could hide a
          # version that was unpublished or broken upstream
          cache: ${{ (github.event_name != 'schedule' && github.event_name != 'workflow_dispatch') && 'pnpm' || '' }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format --check
      - run: pnpm test
      - run: pnpm build

  # Lists the e2e cases (from test/e2e/stacks.test.ts) so the matrix never drifts from the suite.
  setup:
    name: list e2e cases
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.cases.outputs.matrix }}
      has-house: ${{ steps.cases.outputs.has-house }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: cases
        run: |
          matrix="$(node scripts/e2e-cases.ts)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if echo "$matrix" | grep -q '"house"'; then
            echo "has-house=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-house=false" >> "$GITHUB_OUTPUT"
          fi

  # Each case generates a stack, installs it and runs its full gate: typecheck, check, test, build.
  e2e:
    name: e2e (${{ matrix.case }})
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # scheduled and manual runs fetch every package fresh: a cached store could hide a
          # version that was unpublished or broken upstream
          cache: ${{ (github.event_name != 'schedule' && github.event_name != 'workflow_dispatch') && 'pnpm' || '' }}
      - run: pnpm install --frozen-lockfile
      # vitest joins names with " > "; anchored, so `pg-drizzle` doesn't also select `pg-drizzle-orgs`
      - run: pnpm test:e2e -t "^stacks build > ${{ matrix.case }}$" --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/e2e.json"
      # a filter that matches nothing skips everything and still passes
      - run: node scripts/expect-tests-ran.ts "$RUNNER_TEMP/e2e.json" 1

  # `efforge add` on a generated pg-drizzle-orgs project (email, then ai/effect-ai-byok), then the
  # full gate. Not in the stacks matrix, so it gets its own job.
  e2e-add:
    name: e2e (add on a real project)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # scheduled and manual runs fetch every package fresh: a cached store could hide a
          # version that was unpublished or broken upstream
          cache: ${{ (github.event_name != 'schedule' && github.event_name != 'workflow_dispatch') && 'pnpm' || '' }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e -t "^add on a real project > " --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/e2e.json"
      - run: node scripts/expect-tests-ran.ts "$RUNNER_TEMP/e2e.json" 1

  # `efforge upgrade` on real projects made by efforge 0.2.0, 0.2.1 and a pinned commit of next, with and without the
  # owner's own edits, then each project's full gate. Needs the release refs, so a full fetch.
  e2e-upgrade:
    name: e2e (upgrade an old project)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # the old CLIs' create makes the initial commit; without an identity it is skipped, the
      # project stays untracked, and upgrade rightly refuses uncommitted changes
      GIT_AUTHOR_NAME: efforge-ci
      GIT_AUTHOR_EMAIL: efforge-ci@users.noreply.github.com
      GIT_COMMITTER_NAME: efforge-ci
      GIT_COMMITTER_EMAIL: efforge-ci@users.noreply.github.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch --tags origin release-0.2.1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: ${{ (github.event_name != 'schedule' && github.event_name != 'workflow_dispatch') && 'pnpm' || '' }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e -t "^upgrade an old project > " --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/e2e.json"
      - run: node scripts/expect-tests-ran.ts "$RUNNER_TEMP/e2e.json" 6

  # `pnpm smoke:pack`: checks the packed manifest has no dependencies, installs the tarball with
  # npm (its own cache, no lockfile, outside the repo), runs it through npm, npx and pnpm dlx,
  # creates the default stack, builds it, runs one `add` with the packed CLI and builds again.
  # Catches what the repo's own lockfile hides. release.yml runs it on the tarball it publishes.
  smoke-pack:
    name: packed tarball (create, build, add)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # so create's initial commit and add's clean-tree check behave as on a user's machine
      GIT_AUTHOR_NAME: efforge-ci
      GIT_AUTHOR_EMAIL: efforge-ci@users.noreply.github.com
      GIT_COMMITTER_NAME: efforge-ci
      GIT_COMMITTER_EMAIL: efforge-ci@users.noreply.github.com
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # only to build dist/ for the tarball; the smoke install never sees these node_modules
      - run: pnpm install --frozen-lockfile
      - run: pnpm smoke:pack --dir "$RUNNER_TEMP"

  # The Browser extra ships a container image (apps/browser); make sure it builds.
  # Skipped until the `house` e2e case exists on the branch.
  browser-image:
    name: browser image (house)
    needs: setup
    if: needs.setup.outputs.has-house == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # scheduled and manual runs fetch every package fresh: a cached store could hide a
          # version that was unpublished or broken upstream
          cache: ${{ (github.event_name != 'schedule' && github.event_name != 'workflow_dispatch') && 'pnpm' || '' }}
      - run: pnpm install --frozen-lockfile
      - name: Generate the house stack
        run: |
          cd "$RUNNER_TEMP"
          node "$GITHUB_WORKSPACE/src/bin.ts" house-app -y --no-install --no-git \
            --database=postgres --orm=drizzle --auth=better-auth-orgs --infra=alchemy \
            --ai=effect-ai-byok --extras=workflows,realtime,browser,storage,email
      - run: docker build "$RUNNER_TEMP/house-app/apps/browser"

  # Drives the generated pg-drizzle-orgs app with every add-on in Chromium against a real Postgres:
  # sign up, create an org, use every card, invite, accept, both members visible.
  browser-flow:
    name: browser flow (pg-drizzle-orgs + every add-on)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      EFFORGE_E2E_BROWSER: "1"
      EFFORGE_E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # scheduled and manual runs fetch every package fresh: a cached store could hide a
          # version that was unpublished or broken upstream
          cache: ${{ (github.event_name != 'schedule' && github.event_name != 'workflow_dispatch') && 'pnpm' || '' }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e -t "^browser flow > " --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/e2e.json"
      - run: node scripts/expect-tests-ran.ts "$RUNNER_TEMP/e2e.json" 1
